name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker-deploy:
    name: Docker Build & Push (AWS ECR)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # This job is temporarily disabled to prevent CI failures.
    # To enable deployment, remove the 'if: false' line and configure your GitHub Secrets.
    if: false 
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: MyEcomCluster
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/discovery-server:latest ./discovery-server
          docker push $ECR_REGISTRY/discovery-server:latest
          
          docker build -t $ECR_REGISTRY/api-gateway:latest ./api-gateway
          docker push $ECR_REGISTRY/api-gateway:latest
          
          docker build -t $ECR_REGISTRY/product-service:latest ./product-service
          docker push $ECR_REGISTRY/product-service:latest
          
          docker build -t $ECR_REGISTRY/order-service:latest ./order-service
          docker push $ECR_REGISTRY/order-service:latest
          
          docker build -t $ECR_REGISTRY/inventory-service:latest ./inventory-service
          docker push $ECR_REGISTRY/inventory-service:latest
          
          docker build -t $ECR_REGISTRY/frontend:latest ./frontend
          docker push $ECR_REGISTRY/frontend:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        run: kubectl apply -k k8s/
