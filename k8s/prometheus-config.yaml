apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-actuator'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: 
            - 'product-service:8081'
            - 'order-service:8082'
            - 'inventory-service:8083'
            - 'api-gateway:9090'
            - 'discovery-server:8761'
