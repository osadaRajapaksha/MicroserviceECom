apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-gateway.yaml
  - config.yaml
  - discovery-server.yaml
  - inventory-service.yaml
  - kafka-deployment.yaml
  - keycloak-deployment.yaml
  - mysql-deployment.yaml
  - order-service.yaml
  - product-service.yaml
  - redis-deployment.yaml
  - zipkin-deployment.yaml
  - zookeeper-deployment.yaml
  - prometheus-config.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml

# This section replaces the placeholder 'your-docker-registry' with the actual ACR URL.
# Replace 'myecomclusteracr' with your actual Azure Container Registry name.
images:
  - name: your-docker-registry/api-gateway
    newName: myecomclusteracr.azurecr.io/api-gateway
    newTag: latest
  - name: your-docker-registry/product-service
    newName: myecomclusteracr.azurecr.io/product-service
    newTag: latest
  - name: your-docker-registry/order-service
    newName: myecomclusteracr.azurecr.io/order-service
    newTag: latest
  - name: your-docker-registry/inventory-service
    newName: myecomclusteracr.azurecr.io/inventory-service
    newTag: latest
  - name: your-docker-registry/discovery-server
    newName: myecomclusteracr.azurecr.io/discovery-server
    newTag: latest
